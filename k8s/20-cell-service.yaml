# Headless Service (clusterIP: None): no virtual IP and no load balancing.
# Each StatefulSet pod gets a stable DNS name, cell-N.cell.nrs.svc.cluster.local,
# so a UE simulator can address one specific cell (see docs/DESIGN.md section 5).
apiVersion: v1
kind: Service
metadata:
  name: cell
  namespace: nrs
spec:
  clusterIP: None
  selector:
    app: nr-mac-scheduler
  ports:
    - name: ue-reports
      port: 38472
      protocol: UDP
    - name: http
      port: 8080
      protocol: TCP
